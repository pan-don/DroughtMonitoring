<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Earth globe with green land and blue ocean -->
  <defs>
    <radialGradient id="oceanGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#4da6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="landGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#66ff66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228b22;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Ocean circle (background) -->
  <circle cx="50" cy="50" r="45" fill="url(#oceanGradient)" stroke="#003d82" stroke-width="2"/>
  
  <!-- Land masses (continents simplified) -->
  <g fill="url(#landGradient)" stroke="#1a6600" stroke-width="0.5">
    <!-- Africa-like shape -->
    <ellipse cx="55" cy="45" rx="12" ry="18" transform="rotate(-10 55 45)"/>
    
    <!-- Europe-like shape -->
    <ellipse cx="53" cy="28" rx="8" ry="6" transform="rotate(15 53 28)"/>
    
    <!-- Asia-like shape -->
    <path d="M 65 25 Q 75 28 78 35 Q 80 42 75 48 Q 70 52 65 50 Q 62 38 65 25 Z"/>
    
    <!-- Americas-like shape -->
    <ellipse cx="30" cy="35" rx="7" ry="15" transform="rotate(-20 30 35)"/>
    <ellipse cx="28" cy="55" rx="6" ry="12" transform="rotate(-15 28 55)"/>
    
    <!-- Small islands/Australia -->
    <circle cx="75" cy="60" r="5"/>
    <ellipse cx="45" cy="68" rx="4" ry="3"/>
  </g>
  
  <!-- Shine/highlight effect -->
  <circle cx="35" cy="32" r="8" fill="white" opacity="0.3"/>
  <circle cx="32" cy="30" r="4" fill="white" opacity="0.5"/>
</svg>
